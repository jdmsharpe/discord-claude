# Claude model pricing and context-window catalog.
#
# Canonical source: https://docs.claude.com/en/docs/about-claude/pricing
# Cross-referenced against: https://github.com/pydantic/genai-prices/blob/main/prices/providers/anthropic.yml
# Last-verified: 2026-09-03
#
# Prices are USD per million tokens. The calculator derives cache-write cost
# as 2.0x the input price (1h TTL), and cache-read cost as 0.1x the input price
# unless a row declares `cache_read_per_million` (Claude Fable 5.1 reads at
# 0.025x = $0.25/MTok per the pricing page; every other model is 0.1x).
#
# Override this file at runtime by setting CLAUDE_PRICING_PATH to an alternate
# YAML path — useful for pushing new pricing without a code release.

models:
  # GA 2026-09-01. Same $10/$50 as Fable 5; cache reads are 0.025x ($0.25/MTok),
  # not the 0.1x the calculator assumes, so the rate is declared explicitly.
  claude-fable-5-1:
    context_window: 1_000_000
    input_per_million: 10.0
    output_per_million: 50.0
    cache_read_per_million: 0.25

  claude-fable-5:
    context_window: 1_000_000
    input_per_million: 10.0
    output_per_million: 50.0

  # Verified against Anthropic's pricing page 2026-07-24 (GA 2026-07-23).
  claude-opus-5:
    context_window: 1_000_000
    input_per_million: 5.0
    output_per_million: 25.0

  claude-opus-4-8:
    context_window: 1_000_000
    input_per_million: 5.0
    output_per_million: 25.0

  claude-opus-4-7:
    context_window: 1_000_000
    input_per_million: 5.0
    output_per_million: 25.0

  claude-opus-4-6:
    context_window: 1_000_000
    input_per_million: 5.0
    output_per_million: 25.0

  claude-opus-4-5:
    context_window: 200_000
    input_per_million: 5.0
    output_per_million: 25.0

  # Opus 4.1 shut down 2026-08-05 and is no longer selectable; this row is
  # retained so historical conversations still cost correctly.
  claude-opus-4-1:
    context_window: 200_000
    input_per_million: 15.0
    output_per_million: 75.0

  # Sonnet 5's launch "introductory" $2/$10 is now the STANDARD price — Anthropic
  # cancelled the increase to $3/$15 that was scheduled for 2026-09-01
  # (confirmed on the pricing page 2026-08-12). No dated action pending.
  claude-sonnet-5:
    context_window: 1_000_000
    input_per_million: 2.0
    output_per_million: 10.0

  claude-sonnet-4-6:
    context_window: 1_000_000
    input_per_million: 3.0
    output_per_million: 15.0

  claude-sonnet-4-5:
    context_window: 200_000
    input_per_million: 3.0
    output_per_million: 15.0

  claude-haiku-4-5:
    context_window: 200_000
    input_per_million: 1.0
    output_per_million: 5.0

tools:
  web_search:
    per_request: 0.01  # $10 per 1,000 searches

# Fallback applied when calculate_cost() receives an unknown model id.
unknown_model_fallback:
  input_per_million: 15.0
  output_per_million: 75.0
